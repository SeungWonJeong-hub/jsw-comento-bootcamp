# YOLO11-OBB + P2 헤드 — 코멘토 3차 업무 / 정승원
#
# 왜 P2 인가
# ---------
# 표준 YOLO 는 P3/P4/P5 (stride 8/16/32) 에서만 탐지합니다.
# 그런데 한국 근해 선박은 길이 중앙값 30 m = 10 m 해상도에서 3 픽셀입니다.
# stride 8 격자에 3 픽셀 물체를 얹으면 격자 한 칸보다 작아, 위치 오차가
# 원리적으로 최대 ±4 px 까지 벌어집니다. 우리가 측정한 평균 IoU 0.672 가 여기서 나옵니다.
#
# P2 (stride 4) 를 추가하면 격자가 절반이 됩니다.
# 비용은 특징 맵이 4배라 느려지는 것. 소형 객체 탐지의 표준 처방입니다.
#
# 표준 구성과의 차이
#   backbone  동일
#   head      P2 로 한 번 더 올려 concat 하고, Detect 를 [P2, P3, P4, P5] 로 받습니다

nc: 1
ch: 3
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]         # 9
  - [-1, 2, C2PSA, [1024]]           # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]      # 13 (P4/16)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]      # 16 (P3/8)

  # 여기서 한 번 더 올린다 — 이것이 P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False]]      # 19 (P2/4)  <- 3 픽셀 선박을 여기서 잡습니다

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]      # 22 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]      # 25 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]      # 28 (P5/32)

  - [[19, 22, 25, 28], 1, OBB, [nc, 1]]   # Detect(P2, P3, P4, P5)
